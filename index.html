<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>My Image Gallery</h1>
    <div class="filter-container">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="nature">Nature</button>
        <button class="filter-btn" data-category="city">City</button>
        <button class="filter-btn" data-category="animals">Animals</button>
    </div>
    <div class="gallery-grid">
        <div class="gallery-item" data-category="nature">
            <img src="https://picsum.photos/id/1015/600/400" alt="Mountain View">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://picsum.photos/id/1011/600/400" alt="City Street">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://picsum.photos/id/1025/600/400" alt="Dog">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://picsum.photos/id/1039/600/400" alt="Waterfall">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://picsum.photos/id/1031/600/400" alt="Bridge">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://picsum.photos/id/1074/600/400" alt="Lion">
        </div>
    </div>

    <div class="lightbox-modal" id="lightbox">
        <span class="close-btn" id="closeBtn">&times;</span>

        <div class="lightbox-content">
            <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>

            <img src="" alt="Full View" id="lightboxImg">

            <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
